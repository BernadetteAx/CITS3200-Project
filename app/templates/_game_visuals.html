{% macro scene(cell, label, source='game', class_name='', id='') -%}
<div class="game-scene {{ class_name }}" {% if id %}id="{{ id }}"{% endif %}
     data-scene="{{ cell }}" data-source="{{ source }}" role="img" aria-label="{{ label }}"></div>
{%- endmacro %}

{% macro banner(cell, label, eyebrow, title, copy, class_name='') -%}
<div class="phase-banner {{ class_name }}">
    {{ scene(cell, label) }}
    <div class="phase-banner-copy">
        <p class="visual-eyebrow">{{ eyebrow }}</p>
        <h2>{{ title }}</h2>
        <p>{{ copy }}</p>
    </div>
</div>
{%- endmacro %}
